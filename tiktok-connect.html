<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connect TikTok — Elyssa Content OS</title>
  <meta name="description" content="Connect your TikTok account to Elyssa Content OS." />
  <meta name="theme-color" content="#09090b" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="/tiktok-connect" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="/">
        <img src="/favicon.svg" alt="" width="26" height="26" />
        Elyssa Content OS
      </a>
      <nav class="header-links" aria-label="Legal">
        <a href="/privacy">Privacy Policy</a>
        <a href="/terms">Terms of Service</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="connect-page">
      <div class="connect-card">
        <h1>TikTok Account</h1>
        <p class="hint" id="creator-hint">Loading…</p>
        <div id="connect-content">Loading…</div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-brand">
        <img src="/favicon.svg" alt="" width="20" height="20" />
        Elyssa Content OS
      </div>
      <nav class="footer-links" aria-label="Legal">
        <a href="/privacy">Privacy Policy</a>
        <a href="/terms">Terms of Service</a>
        <a href="mailto:business@elyssia-agency.com">business@elyssia-agency.com</a>
      </nav>
      <div class="footer-meta">
        <span>© <span id="year">2026</span> Elyssa Content OS. All rights reserved.</span>
        <span>Made for creators and agencies.</span>
      </div>
    </div>
  </footer>

  <script src="/script.js" defer></script>
  <script>
    /**
     * Cette page tourne sur le même domaine que le backend grâce au rewrite
     * Vercel (/social/:path* -> API FastAPI, voir vercel.json). Tous les
     * appels ci-dessous sont donc des chemins RELATIFS, same-origin : pas de
     * CORS nécessaire côté navigateur.
     *
     * C'est aussi la page vers laquelle POST /social/tiktok/callback
     * redirige après la connexion (FRONTEND_URL côté backend), avec
     * ?tiktok=connected|error en plus dans l'URL.
     */
    (function () {
      var params = new URLSearchParams(window.location.search);
      var creatorId = params.get("creator_id") || "";
      var status = params.get("tiktok");
      var message = params.get("message");

      var hint = document.getElementById("creator-hint");
      var content = document.getElementById("connect-content");

      hint.textContent = creatorId ? "Creator: " + creatorId : "Missing creator_id in URL.";

      function renderConnectButton() {
        content.innerHTML =
          '<a class="btn-primary" href="/social/tiktok/login?creator_id=' +
          encodeURIComponent(creatorId) +
          '"><span class="dot"></span>Connect TikTok</a>';
      }

      function renderConnected(account) {
        content.innerHTML =
          '<img class="connect-avatar" src="' +
          (account.avatar_url || "") +
          '" alt="" />' +
          '<div class="connect-status"><span class="dot"></span>Connected</div>' +
          '<p class="connect-name">' +
          (account.display_name || account.open_id) +
          "</p>";
      }

      function appendError(text) {
        var el = document.createElement("p");
        el.className = "connect-error";
        el.textContent = text;
        content.appendChild(el);
      }

      function refreshStatus() {
        if (!creatorId) {
          content.innerHTML = "<p>Add ?creator_id=... to this URL to connect an account.</p>";
          return;
        }

        fetch("/social/accounts/" + encodeURIComponent(creatorId))
          .then(function (res) {
            if (!res.ok) throw new Error("status " + res.status);
            return res.json();
          })
          .then(function (accounts) {
            var tiktokAccount = (accounts || []).find(function (a) {
              return a.platform === "tiktok";
            });
            if (tiktokAccount) {
              renderConnected(tiktokAccount);
            } else {
              renderConnectButton();
            }
            if (status === "error" && message) {
              appendError(decodeURIComponent(message));
            }
          })
          .catch(function () {
            renderConnectButton();
            appendError("Could not check TikTok connection status.");
          });
      }

      refreshStatus();
    })();
  </script>
</body>
</html>
